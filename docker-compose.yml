# Local development infrastructure for Folder Gumbo.
#
#   docker compose up -d
#
# Gives you S3-compatible object storage (MinIO) and MongoDB, so the app
# runs end to end with no cloud account. See README.md for the matching
# server/.env values.

services:
  # S3-compatible object storage. The server talks to this through the
  # standard S3 protocol via S3_ENDPOINT, so nothing about the app is
  # MinIO-specific.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API      -> S3_ENDPOINT=http://127.0.0.1:9000
      - "9001:9001" # Web console -> http://127.0.0.1:9001 (minioadmin/minioadmin)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # One-shot: creates the bucket the server expects, then exits.
  # `docker compose ps` will show it as Exited(0); that is success.
  createbucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/folder-gumbo &&
      echo 'Bucket folder-gumbo is ready'
      "

  mongo:
    image: mongo:7
    ports:
      # Override if you already run mongod on 27017:
      #   MONGO_PORT=27018 docker compose up -d
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  minio-data:
  mongo-data:
